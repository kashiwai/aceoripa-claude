<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI API接続テスト</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .success {
            border-left: 4px solid #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }
        
        .error {
            border-left: 4px solid #f44336;
            background: rgba(244, 67, 54, 0.2);
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-family: inherit;
            resize: vertical;
        }
        
        textarea::placeholder {
            color: rgba(255,255,255,0.7);
        }
        
        .image-result {
            text-align: center;
            margin-top: 20px;
        }
        
        .image-result img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 OpenAI API接続テスト</h1>
        
        <!-- API接続テスト -->
        <div class="test-section">
            <h2>🔗 API接続確認</h2>
            <p>OpenAI APIキーの設定と接続状況を確認します。</p>
            <button onclick="testConnection()" id="connectionBtn">
                📡 接続テスト実行
            </button>
            <div class="loading" id="connectionLoading">
                <div class="spinner"></div>
                <div>接続確認中...</div>
            </div>
            <div id="connectionResult" class="result" style="display: none;"></div>
        </div>

        <!-- DALL-E 3テスト -->
        <div class="test-section">
            <h2>🎨 DALL-E 3 画像生成テスト</h2>
            <p>実際にポケモン画像を生成してテストします。</p>
            
            <textarea id="promptInput" placeholder="プロンプトを入力してください（空白の場合はデフォルトのピカチュウが生成されます）">Epic Pikachu Pokemon with electric lightning effects, rainbow aura explosion, legendary reveal animation, vertical 9:16 composition, anime style, high quality</textarea>
            
            <button onclick="testDALLE()" id="dalleBtn">
                ⚡ DALL-E 3 画像生成テスト
            </button>
            
            <div class="loading" id="dalleLoading">
                <div class="spinner"></div>
                <div>画像生成中...</div>
            </div>
            <div id="dalleResult" class="result" style="display: none;"></div>
            <div id="imageResult" class="image-result"></div>
        </div>

        <!-- 診断結果 -->
        <div class="test-section">
            <h2>📊 診断結果</h2>
            <div id="diagnosis">
                <p>上記のテストを実行して問題を診断してください。</p>
            </div>
        </div>
    </div>

    <script>
        async function testConnection() {
            const btn = document.getElementById('connectionBtn');
            const loading = document.getElementById('connectionLoading');
            const result = document.getElementById('connectionResult');
            
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/test-openai');
                const data = await response.json();
                
                loading.style.display = 'none';
                result.style.display = 'block';
                
                if (data.success) {
                    result.className = 'result success';
                    result.textContent = `✅ 接続成功！
                    
APIキー: ${data.maskedKey}
利用可能モデル数: ${data.modelsCount}
主要モデル: ${data.availableModels?.join(', ')}
接続状況: ${data.connection}`;
                    
                    updateDiagnosis('connection', true, '✅ OpenAI API接続正常');
                } else {
                    result.className = 'result error';
                    result.textContent = `❌ 接続失敗
                    
エラー: ${data.error}
メッセージ: ${data.message || 'なし'}
APIキー設定: ${data.hasKey ? '設定済み' : '未設定'}`;
                    
                    updateDiagnosis('connection', false, `❌ API接続エラー: ${data.error}`);
                }
            } catch (error) {
                loading.style.display = 'none';
                result.style.display = 'block';
                result.className = 'result error';
                result.textContent = `❌ ネットワークエラー
                
${error.message}`;
                
                updateDiagnosis('connection', false, `❌ ネットワークエラー: ${error.message}`);
            }
            
            btn.disabled = false;
        }

        async function testDALLE() {
            const btn = document.getElementById('dalleBtn');
            const loading = document.getElementById('dalleLoading');
            const result = document.getElementById('dalleResult');
            const imageResult = document.getElementById('imageResult');
            const prompt = document.getElementById('promptInput').value;
            
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            imageResult.innerHTML = '';
            
            try {
                const response = await fetch('/api/test-openai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt }),
                });
                
                const data = await response.json();
                
                loading.style.display = 'none';
                result.style.display = 'block';
                
                if (data.success) {
                    result.className = 'result success';
                    result.textContent = `✅ DALL-E 3 生成成功！
                    
画像URL: ${data.imageUrl}
修正プロンプト: ${data.revisedPrompt}`;
                    
                    imageResult.innerHTML = `
                        <h3>生成された画像:</h3>
                        <img src="${data.imageUrl}" alt="Generated Pokemon" />
                        <p><a href="${data.imageUrl}" target="_blank">画像を別タブで開く</a></p>
                    `;
                    
                    updateDiagnosis('dalle', true, '✅ DALL-E 3 画像生成成功');
                } else {
                    result.className = 'result error';
                    result.textContent = `❌ DALL-E 3 生成失敗
                    
エラー: ${data.error}
ステータス: ${data.status || 'なし'}
メッセージ: ${data.message || 'なし'}
詳細: ${JSON.stringify(data.details, null, 2)}`;
                    
                    updateDiagnosis('dalle', false, `❌ DALL-E 3 エラー: ${data.error}`);
                }
            } catch (error) {
                loading.style.display = 'none';
                result.style.display = 'block';
                result.className = 'result error';
                result.textContent = `❌ リクエストエラー
                
${error.message}`;
                
                updateDiagnosis('dalle', false, `❌ リクエストエラー: ${error.message}`);
            }
            
            btn.disabled = false;
        }

        const diagnosisResults = {};

        function updateDiagnosis(test, success, message) {
            diagnosisResults[test] = { success, message };
            
            const diagnosis = document.getElementById('diagnosis');
            const results = Object.values(diagnosisResults);
            
            if (results.length === 0) return;
            
            const allSuccess = results.every(r => r.success);
            const anyTested = results.length > 0;
            
            let html = '<h3>テスト結果:</h3><ul>';
            Object.values(diagnosisResults).forEach(result => {
                html += `<li>${result.message}</li>`;
            });
            html += '</ul>';
            
            if (anyTested) {
                if (allSuccess) {
                    html += `
                        <div class="success" style="margin-top: 15px; padding: 15px; border-radius: 8px;">
                            <h4>🎉 すべてのテストが成功しました！</h4>
                            <p>OpenAI APIは正常に動作しています。AI動画生成機能が利用できます。</p>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="error" style="margin-top: 15px; padding: 15px; border-radius: 8px;">
                            <h4>⚠️ 問題が検出されました</h4>
                            <p>上記のエラーを確認して、APIキーの設定や権限を確認してください。</p>
                        </div>
                    `;
                }
            }
            
            diagnosis.innerHTML = html;
        }

        // ページ読み込み時に自動で接続テスト実行
        window.onload = function() {
            setTimeout(testConnection, 1000);
        };
    </script>
</body>
</html>

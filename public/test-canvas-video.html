<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas動画生成テスト</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #status {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        #videoContainer {
            text-align: center;
        }
        
        video {
            max-width: 100%;
            max-height: 600px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .hidden {
            display: none;
        }
        
        .progress {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Canvas動画生成テスト</h1>
        
        <div id="status">
            <p>テスト用の動画生成システムです</p>
        </div>
        
        <div class="controls">
            <button onclick="testSimpleAnimation()">
                📹 シンプルなアニメーションテスト
            </button>
            
            <button onclick="testImageAnimation()">
                🖼️ 画像アニメーションテスト
            </button>
            
            <button onclick="testPremiumEffects()">
                ✨ プレミアムエフェクトテスト
            </button>
        </div>
        
        <div class="progress hidden" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div id="videoContainer"></div>
    </div>

    <script>
        const status = document.getElementById('status');
        const videoContainer = document.getElementById('videoContainer');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        
        function updateStatus(message, isError = false) {
            status.innerHTML = `<p style="color: ${isError ? '#ff6b6b' : 'white'}">${message}</p>`;
            console.log(message);
        }
        
        function updateProgress(percent) {
            progressBar.style.width = percent + '%';
        }
        
        // シンプルなアニメーションテスト
        async function testSimpleAnimation() {
            try {
                updateStatus('🎬 シンプルなアニメーション生成開始...');
                progressContainer.classList.remove('hidden');
                updateProgress(0);
                
                const canvas = document.createElement('canvas');
                canvas.width = 1080;
                canvas.height = 1920;
                const ctx = canvas.getContext('2d');
                
                // MediaRecorder設定
                const stream = canvas.captureStream(30);
                const recorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm',
                    videoBitsPerSecond: 5000000
                });
                
                const chunks = [];
                recorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };
                
                recorder.onstart = () => {
                    updateStatus('📹 録画開始...');
                };
                
                recorder.onstop = () => {
                    updateStatus('✅ 録画完了！処理中...');
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    displayVideo(url);
                    updateProgress(100);
                };
                
                // 録画開始
                recorder.start();
                
                // アニメーション描画
                const duration = 3; // 3秒
                const fps = 30;
                const totalFrames = duration * fps;
                
                for (let frame = 0; frame < totalFrames; frame++) {
                    const progress = frame / totalFrames;
                    updateProgress(progress * 100);
                    
                    // 背景
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 円のアニメーション
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    const radius = 100 + Math.sin(progress * Math.PI * 2) * 50;
                    
                    // グラデーション
                    const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                    gradient.addColorStop(0, `hsl(${progress * 360}, 100%, 50%)`);
                    gradient.addColorStop(1, 'rgba(255,255,255,0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // フレーム待機
                    await new Promise(resolve => setTimeout(resolve, 1000 / fps));
                }
                
                // 録画停止
                recorder.stop();
                
            } catch (error) {
                updateStatus(`❌ エラー: ${error.message}`, true);
                console.error(error);
            }
        }
        
        // 画像アニメーションテスト
        async function testImageAnimation() {
            try {
                updateStatus('🖼️ 画像読み込み中...');
                progressContainer.classList.remove('hidden');
                updateProgress(0);
                
                // テスト用画像を作成
                const testImage = new Image();
                testImage.src = 'data:image/svg+xml;base64,' + btoa(`
                    <svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
                        <rect width="400" height="400" fill="#FFD700"/>
                        <circle cx="200" cy="200" r="150" fill="#FF6B6B"/>
                        <text x="200" y="220" font-size="60" text-anchor="middle" fill="white">TEST</text>
                    </svg>
                `);
                
                await new Promise((resolve) => {
                    testImage.onload = resolve;
                });
                
                updateStatus('🎬 動画生成開始...');
                
                const canvas = document.createElement('canvas');
                canvas.width = 1080;
                canvas.height = 1920;
                const ctx = canvas.getContext('2d');
                
                const stream = canvas.captureStream(30);
                const recorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm'
                });
                
                const chunks = [];
                recorder.ondataavailable = (e) => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    displayVideo(url);
                    updateStatus('✅ 画像アニメーション動画生成完了！');
                    updateProgress(100);
                };
                
                recorder.start();
                
                // アニメーション
                const duration = 5;
                const fps = 30;
                const totalFrames = duration * fps;
                
                for (let frame = 0; frame < totalFrames; frame++) {
                    const progress = frame / totalFrames;
                    updateProgress(progress * 100);
                    
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 画像を中央に配置してアニメーション
                    ctx.save();
                    
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    
                    // 回転とスケール
                    ctx.translate(centerX, centerY);
                    ctx.rotate(progress * Math.PI * 2);
                    ctx.scale(1 + Math.sin(progress * Math.PI) * 0.5, 1 + Math.sin(progress * Math.PI) * 0.5);
                    ctx.translate(-centerX, -centerY);
                    
                    // 画像描画
                    const imgX = (canvas.width - testImage.width) / 2;
                    const imgY = (canvas.height - testImage.height) / 2;
                    ctx.drawImage(testImage, imgX, imgY);
                    
                    ctx.restore();
                    
                    await new Promise(resolve => setTimeout(resolve, 1000 / fps));
                }
                
                recorder.stop();
                
            } catch (error) {
                updateStatus(`❌ エラー: ${error.message}`, true);
                console.error(error);
            }
        }
        
        // プレミアムエフェクトテスト
        async function testPremiumEffects() {
            updateStatus('✨ プレミアムエフェクトは実装中です...');
            // TODO: プレミアムエフェクトの実装
        }
        
        // 動画表示
        function displayVideo(url) {
            videoContainer.innerHTML = `
                <h3>生成された動画:</h3>
                <video src="${url}" controls autoplay style="width: 360px; height: 640px;"></video>
                <br><br>
                <button onclick="downloadVideo('${url}')">📥 ダウンロード</button>
            `;
        }
        
        // ダウンロード
        function downloadVideo(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `canvas-video-${Date.now()}.webm`;
            a.click();
        }
        
        // MediaRecorder対応確認
        if (!window.MediaRecorder) {
            updateStatus('❌ お使いのブラウザはMediaRecorderに対応していません', true);
        } else {
            updateStatus('✅ MediaRecorder対応確認OK');
        }
    </script>
</body>
</html>
